name: qualify-v062-submission-fit-semantic
on:
  push:
    branches: [agent/v0.62-submission-fit-semantic]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.62-submission-fit-semantic
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic-fit tranche
        run: |
          if grep -q '"version":"0.62.0"' package.json; then
            echo 'v0.62 source already promoted'
          else
            node scripts/apply-v062-submission-fit-semantic.mjs
          fi
      - run: npm install --no-audit --no-fund
      - name: Prove v0.62 semantic-fit contract
        run: node scripts/v062-submission-fit-smoke.mjs
      - name: Full gameplay, visual, packed and liveness qualification
        run: npm run test:visual
      - name: Report exact cartridge budget
        run: |
          stat -c 'submission bytes: %s' dist/unicorn-stampede.zip
          node -e "let f=require('fs'),n=f.statSync('dist/unicorn-stampede.zip').size;console.log('delta vs 13312:',n-13312,'bytes');"
          head -100 dist/compression.json
      - name: Enforce js13k budget
        run: node -e "let n=require('fs').statSync('dist/unicorn-stampede.zip').size;if(n>13312)throw Error('v0.62 still '+(n-13312)+' bytes over');console.log('v0.62 budget PASS with '+(13312-n)+' bytes free')"
      - name: Promote exact qualified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/render.js src/herd.js src/top10.js src/core.js src/whip.js src/expansion.js src/polish.js package.json
          if ! git diff --cached --quiet; then
            git commit -m "perf: fit semantic town inside js13k budget"
            git push origin HEAD:agent/v0.62-submission-fit-semantic
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unicorn-stampede-v062-submission-fit-semantic
          path: |
            dist/local.html
            dist/preview.html
            dist/index.html
            dist/unicorn-stampede.zip
            dist/compression.json
