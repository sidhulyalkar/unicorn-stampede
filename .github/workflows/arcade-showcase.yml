name: Arcade showcase qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/arcade-showcase.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded board score, SDK and onboarding
        run: |
          node scripts/showcase-v121-ranked-score.mjs
          node scripts/showcase-v117-arcade-smoke.mjs
      - name: Build Arcade archive
        run: node scripts/build-arcade.mjs
      - name: Independently inspect ZIP integrity
        run: |
          python3 - <<'PY'
          import zipfile
          p='dist/arcade/unicorn-stampede-arcade.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              assert 'index.html' in names
              assert all(not n.startswith('/') and '..' not in n.split('/') for n in names)
              print('Arcade ZIP entries:',len(names))
          PY
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox
      - name: Extract the exact Arcade submission ZIP
        run: |
          mkdir -p dist/arcade/extracted
          unzip -qq dist/arcade/unicorn-stampede-arcade.zip -d dist/arcade/extracted
          test -f dist/arcade/extracted/index.html
      - name: Live game and landmark qualification from uploaded ZIP
        env:
          ARCADE_TEST_ROOT: dist/arcade/extracted
        run: node scripts/showcase-v118-browser.mjs
      - name: Conquest, replay and cloud race qualification from uploaded ZIP
        env:
          ARCADE_TEST_ROOT: dist/arcade/extracted
        run: node scripts/showcase-v119-browser.mjs
      - name: Real keyboard and pointer input qualification from uploaded ZIP
        env:
          ARCADE_TEST_ROOT: dist/arcade/extracted
        run: node scripts/showcase-v122-input-browser.mjs
      - name: Real first-run mission compass qualification from uploaded ZIP
        env:
          ARCADE_TEST_ROOT: dist/arcade/extracted
        run: node scripts/showcase-v123-mission-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-arcade-preview
          if-no-files-found: error
          path: |
            dist/arcade/unicorn-stampede-arcade.zip
            dist/arcade/manifest.json
            dist/arcade/unicorn-stampede-cover.png
            dist/arcade/*-launch.png
            dist/arcade/qualification-v119.json
            dist/arcade/qualification-v122.json
            dist/arcade/*-input.png
            dist/arcade/qualification-v123.json
            dist/arcade/*-mission.png
