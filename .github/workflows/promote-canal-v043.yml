name: promote-canal-v043
on:
  push:
    branches: [agent/v0.43-canal-quarter]
    paths:
      - scripts/promote-canal-v043.mjs
      - .github/workflows/promote-canal-v043.yml
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.43-canal-quarter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/promote-canal-v043.mjs
      - run: node --check src/render.js && node --check src/worlds.js && node --check src/top10.js && node --check scripts/washwater-smoke.mjs && node --check scripts/graphics-v041-smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render.js src/worlds.js src/top10.js scripts/washwater-smoke.mjs scripts/graphics-v041-smoke.mjs package.json
          git commit -m 'feat: v0.43 canal quarter with bridge chokepoints'
          git push origin HEAD:agent/v0.43-canal-quarter
