name: playtest-build
on:
  push:
    branches:
      - agent/v0.40-graphics-rethink
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/build.mjs
      - run: node scripts/packed-smoke.mjs
      - run: cp dist/local.html unicorn-stampede-v040-washwater-playtest.html
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-v040-washwater-playtest
          path: unicorn-stampede-v040-washwater-playtest.html
          retention-days: 30
