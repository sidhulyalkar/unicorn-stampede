name: playtest-build
on:
  push:
    branches:
      - agent/v0.40-graphics-rethink
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.40-graphics-rethink
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -f scripts/fix-whip-render.mjs ]; then
            node scripts/fix-whip-render.mjs
            node --check src/whip.js
            node scripts/whip-render-smoke.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/whip.js scripts/whip-render-smoke.mjs package.json
            git commit -m 'fix: render whip above world overlays' || true
            git push origin HEAD:agent/v0.40-graphics-rethink
          fi
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/build.mjs
      - run: node scripts/packed-smoke.mjs
      - run: cp dist/local.html unicorn-stampede-v040-washwater-playtest.html
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-v040-washwater-playtest
          path: unicorn-stampede-v040-washwater-playtest.html
          retention-days: 30
