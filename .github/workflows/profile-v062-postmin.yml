name: profile-v062-postmin
on:
  push:
    branches: [research/v0.62-representation-frontier]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v0.62-representation-frontier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/v062-postmin-profiler.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v062-postmin-profile
          path: |
            dist/v062-postmin-profile.json
            dist/v062-minified-base.js
          retention-days: 30
