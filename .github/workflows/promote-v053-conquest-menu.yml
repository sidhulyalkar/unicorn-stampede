name: promote-v053-conquest-menu
on:
  push:
    branches: [agent/v0.53-conquest-clarity-menu-clicks]
    paths:
      - scripts/apply-v053-conquest-menu.mjs
      - scripts/v053-conquest-menu-smoke.mjs
      - .github/workflows/promote-v053-conquest-menu.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.53-conquest-clarity-menu-clicks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Apply v0.53 candidate
        run: node scripts/apply-v053-conquest-menu.mjs
      - name: Explicit v0.53 contract
        run: node scripts/v053-conquest-menu-smoke.mjs
      - name: Full regression and 13kb qualification
        run: npm test
      - name: Promote v0.53 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/whip.js src/expansion.js package.json scripts/smoke.mjs scripts/rules-v044-smoke.mjs scripts/v050-menu-smoke.mjs scripts/v051-launch-config-smoke.mjs scripts/release-prune.mjs scripts/packed-smoke.mjs scripts/v053-conquest-menu-smoke.mjs
          git diff --cached --check
          git commit -m 'feat: clarify conquest and make menu clickable'
          git push origin HEAD:agent/v0.53-conquest-clarity-menu-clicks
      - name: Upload qualified v0.53
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-v053
          path: dist/
          if-no-files-found: error
