name: apply-v045-washwater
on:
  push:
    branches: [agent/v0.45-washwater-quays-skip]
    paths:
      - scripts/apply-v045-washwater.mjs
      - .github/workflows/apply-v045-washwater.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.45-washwater-quays-skip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-v045-washwater.mjs
      - run: node --check src/render.js && node --check src/expansion.js && node --check scripts/v045-scenery-skip-smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render.js src/expansion.js package.json scripts/v045-scenery-skip-smoke.mjs
          git commit -m 'feat: add Washwater quays and training skip'
          git push origin HEAD:agent/v0.45-washwater-quays-skip
