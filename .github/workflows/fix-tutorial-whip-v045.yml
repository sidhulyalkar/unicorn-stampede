name: fix-tutorial-whip-v045
on:
  push:
    branches: [agent/v0.44-live-rainbow-whip]
    paths:
      - scripts/fix-tutorial-whip-v045.mjs
      - .github/workflows/fix-tutorial-whip-v045.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.44-live-rainbow-whip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-tutorial-whip-v045.mjs
      - run: node --check src/whip.js && node --check scripts/whip-render-smoke.mjs && node --check scripts/whip-cadence-smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/whip.js scripts/whip-render-smoke.mjs scripts/whip-cadence-smoke.mjs
          git commit -m 'fix: never gate tutorial whip and thicken lash'
          git push origin HEAD:agent/v0.44-live-rainbow-whip
