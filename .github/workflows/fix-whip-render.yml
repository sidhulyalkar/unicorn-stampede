name: fix-whip-render
on:
  push:
    branches:
      - agent/v0.40-graphics-rethink
    paths:
      - scripts/fix-whip-render.mjs
      - .github/workflows/fix-whip-render.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.40-graphics-rethink
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-whip-render.mjs
      - run: node --check src/whip.js && node scripts/whip-render-smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/whip.js scripts/whip-render-smoke.mjs package.json
          git commit -m 'fix: render whip above world overlays' || exit 0
          git push origin HEAD:agent/v0.40-graphics-rethink
