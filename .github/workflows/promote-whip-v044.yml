name: promote-whip-v044
on:
  push:
    branches: [agent/v0.44-live-rainbow-whip]
    paths:
      - scripts/promote-whip-v044.mjs
      - .github/workflows/promote-whip-v044.yml
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.44-live-rainbow-whip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/promote-whip-v044.mjs
      - run: node --check src/whip.js && node --check scripts/whip-render-smoke.mjs && node --check scripts/whip-cadence-smoke.mjs && node --check scripts/smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/whip.js scripts/whip-render-smoke.mjs scripts/whip-cadence-smoke.mjs scripts/smoke.mjs package.json
          git commit -m 'feat: v0.44 queued rainbow snap whip'
          git push origin HEAD:agent/v0.44-live-rainbow-whip
