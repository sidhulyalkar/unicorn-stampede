name: promote-whip-v040
on:
  push:
    branches:
      - agent/v0.40-graphics-rethink
    paths:
      - scripts/promote-whip-v040.mjs
      - .github/workflows/promote-whip-v040.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.40-graphics-rethink
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/promote-whip-v040.mjs
      - run: node --check src/whip.js && node --check scripts/smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/whip.js scripts/smoke.mjs
          git commit -m 'fix: make whip readable, elastic, and top-layer safe' || exit 0
          git push origin HEAD:agent/v0.40-graphics-rethink
