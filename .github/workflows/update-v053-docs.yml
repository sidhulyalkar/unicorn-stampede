name: update-v053-docs
on:
  push:
    branches: [agent/v0.53-conquest-clarity-menu-clicks]
    paths: [.github/workflows/update-v053-docs.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.53-conquest-clarity-menu-clicks
      - name: Align README with v0.53
        run: |
          node <<'NODE'
          const fs=require('fs');let p='README.md',s=fs.readFileSync(p,'utf8');
          function r(a,b){if(!s.includes(a))throw Error('README anchor missing: '+a);s=s.replace(a,b)}
          r(`4. Survive **Final Cleanup**.\n5. Secure all four districts.\n6. Reach the global color target.\n7. Rescue any prisoners.\n8. Hold the conquered town briefly.\n\nThen Town Hall falls, the city erupts into rainbow color, and the run ends with **TOWN CONQUERED**.`,`4. Enter **Takeover**: secure all four districts and reach the global color target.\n5. Keep the whole herd free: rescue any captured unicorns.\n\nThe instant Hall + districts + color + herd safety are all satisfied, conquest locks. The city erupts into rainbow color and the run resolves to **TOWN CONQUERED**. Ordinary buildings are useful for Chaos and score, but destroying every building is not a hidden win requirement.`);
          r(`| **A / D on title** | change unlocked world |\n| **M on title** | change difficulty |\n| **C on title** | open Rules |`,`| **A / D or click world on title** | change world |\n| **M or click difficulty on title** | change difficulty |\n| **T or click Tutorial on title** | toggle tutorial |\n| **C or click Rules on title** | open Rules |\n| **Enter / Space or click Start** | launch the selected configuration |`);
          s=s.replaceAll('## Contextual coaching on Normal','## Contextual coaching on Easy').replaceAll('Normal mode has','Easy mode has').replaceAll('quiet Normal coaching','quiet Easy coaching').replaceAll('Modes: **Normal, Medium, Hard, Impossible**.','Modes: **Easy, Medium, Hard, Impossible**.');
          r('- Smash Town Hall: **FINAL CLEANUP**.','- Smash Town Hall: **TAKEOVER** begins.');
          r(`### Prisborough\n\nThe baseline city. It emphasizes readable streets, landmarks, district structure, and the core herd-management loop.\n\n### Washwater Bay\n\nFaster cleanup pressure plus animated rain. Environmental motion is generated from the shared game clock, adding atmosphere without textures or additional runtime state.\n\n### Cloudtop Heights\n\nMoving cloud banks and crosswinds alter movement and Whip timing. The environment becomes part of route planning.`,`### Prismborough\n\nThe open civic-grid baseline. It emphasizes readable streets, distributed herd attention, landmarks, distractions, and free routing.\n\n### Washwater Bay\n\nA waterfront world built around a winding river, two bridge corridors, marina space, and aggressive cleanup patrols. Crossing the river concentrates routes and makes rescue/territory decisions more deliberate.\n\n### Cloudtop Heights\n\nAlternating stone cliff passes and a reversing crosswind turn the map into a top/bottom slalom. Route timing and recovery matter more than generic distraction pressure.`);
          r(`Town Hall is a phase transition, not an instant victory button. After the Hall falls, Final Cleanup continues attacking your infrastructure. You must still secure districts, reach the color requirement, clear all prisoners, and hold the town.\n\nThe successful transition has several readable beats:\n\n**HOLD THE TOWN → TOWN HALL FALLS! → RAINBOW TAKEOVER! → TOWN CONQUERED**`,`Town Hall is the climax trigger, not the entire win condition. After the Hall falls, the HUD explicitly enters **TAKEOVER**. You must secure all four district checkpoints, reach the current global color target, and have no captured unicorns. Once those conditions are true together, victory latches immediately and cannot be stolen during the celebration.\n\nThe successful transition has several readable beats:\n\n**TAKEOVER → CONQUEST READY → TOWN HALL FALLS! → RAINBOW TAKEOVER! → TOWN CONQUERED**`);
          r('difficulty separation, Final Cleanup, breakable hold, multi-frame conquest, latched results, menu replay, browser-safe preview parity, and one-root-file submission ZIP integrity.','difficulty separation, explicit Takeover objectives, immediate conquest latching, clickable title configuration, packed pointer interactions, latched results, menu replay, browser-safe preview parity, and one-root-file submission ZIP integrity.');
          fs.writeFileSync(p,s);
          NODE
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          git commit -m 'docs: align rules and worlds with v0.53'
          git push origin HEAD:agent/v0.53-conquest-clarity-menu-clicks
