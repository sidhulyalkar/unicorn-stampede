name: promote-graphics-v041
on:
  push:
    branches: [agent/v0.41-architecture-first-polish]
    paths:
      - scripts/promote-graphics-v041.mjs
      - .github/workflows/promote-graphics-v041.yml
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.41-architecture-first-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/promote-graphics-v041.mjs
      - run: node --check src/render.js && node --check src/worlds.js && node --check scripts/graphics-v041-smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render.js src/worlds.js package.json scripts/washwater-smoke.mjs scripts/graphics-v041-smoke.mjs
          git commit -m 'feat: v0.41 architecture-first graphics polish'
          git push origin HEAD:agent/v0.41-architecture-first-polish
