name: promote-v056-town-identity-easy
on:
  push:
    branches: [agent/v0.56-town-identity-easy]
permissions:
  contents: write
concurrency:
  group: promote-v056-town-identity-easy
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.56-town-identity-easy
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply v0.56 candidate if needed
        run: |
          if node -e "process.exit(require('./package.json').version==='0.56.0'?0:1)"; then
            echo "v0.56 already promoted; qualifying exact committed source"
          else
            node scripts/apply-v056-town-identity-easy.mjs
            node scripts/apply-v056-town-market-fix.mjs
            node scripts/apply-v056-history-contracts.mjs
            node scripts/apply-v056-bytecut.mjs
            node scripts/apply-v056-bytecut2.mjs
            node scripts/apply-v056-bytecut3.mjs
            cp scripts/v056-town-difficulty-smoke-template.mjs scripts/v056-town-difficulty-smoke.mjs
          fi
      - name: Prove syntax + dedicated contract
        run: |
          node --check src/render.js
          node --check src/worlds.js
          node --check src/expansion.js
          node --check src/top10.js
          node scripts/v056-town-difficulty-smoke.mjs
      - name: Full historical + liveness qualification
        run: npm test
      - name: Enforce JS13k budget
        run: test "$(stat -c%s dist/unicorn-stampede.zip)" -le 13312
      - name: Promote exact qualified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/render.js src/worlds.js src/expansion.js src/top10.js package.json scripts/release-prune.mjs scripts/smoke.mjs scripts/competitive-smoke.mjs scripts/difficulty-smoke.mjs scripts/washwater-smoke.mjs scripts/v047-waterfront-smoke.mjs scripts/v049-world-identity-smoke.mjs scripts/v050-menu-smoke.mjs scripts/v053-conquest-menu-smoke.mjs scripts/v054-semantic-cloudtop-smoke.mjs scripts/v055-structured-storefronts-smoke.mjs scripts/v056-town-difficulty-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m "feat: stabilize towns and rebalance Easy"
            git push origin HEAD:agent/v0.56-town-identity-easy
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-v056-test
          path: |
            dist/local.html
            dist/preview.html
            dist/index.html
            dist/unicorn-stampede.zip
            dist/compression.json
