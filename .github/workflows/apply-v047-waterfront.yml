name: apply-v047-waterfront
on:
  push:
    branches: [agent/v0.47-washwater-waterfront]
    paths:
      - scripts/apply-v047-waterfront.mjs
      - .github/workflows/apply-v047-waterfront.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.47-washwater-waterfront
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-v047-waterfront.mjs
      - run: node --check src/worlds.js && node --check src/render.js && node --check scripts/washwater-smoke.mjs && node --check scripts/v047-waterfront-smoke.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worlds.js src/render.js scripts/washwater-smoke.mjs scripts/v045-scenery-skip-smoke.mjs scripts/v047-waterfront-smoke.mjs package.json
          git commit -m 'feat: redesign Washwater as winding waterfront town'
          git push origin HEAD:agent/v0.47-washwater-waterfront
