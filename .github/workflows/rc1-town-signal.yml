name: RC1 town signal
on:
  push:
    branches: [agent/rc1-town-signal-per-byte,agent/rc1-cloudtop-unstick-town-detail]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/rc1-town-signal-smoke.mjs
      - run: node scripts/rc1-release-identity-smoke.mjs
      - run: node scripts/rc1-cloudtop-unstick-smoke.mjs
      - run: node scripts/v049-world-identity-smoke.mjs
      - run: npm run build
      - run: node scripts/release-preview.mjs
      - run: npm run size
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox
      - run: node scripts/browser-cross-engine-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rc1-town-signal-dist
          path: dist/
