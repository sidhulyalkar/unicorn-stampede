name: qualify-v063-rich-town-recovery
on:
  push:
    branches: [agent/v0.63-rich-town-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Full historical gameplay + visual qualification
        run: npm test
      - name: Measure rich-town cartridge
        run: |
          stat -c 'submission bytes: %s' dist/unicorn-stampede.zip
          node -e "let f=require('fs'),n=f.statSync('dist/unicorn-stampede.zip').size;console.log('delta vs 13312:',n-13312,'bytes')"
          head -100 dist/compression.json
      - name: Verify archive root
        run: unzip -t dist/unicorn-stampede.zip && test "$(unzip -Z1 dist/unicorn-stampede.zip)" = "index.html"
      - name: Verify browser-safe local build
        run: test -s dist/local.html && ! grep -q "document.write" dist/local.html && cmp dist/local.html dist/preview.html
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-v063-rich-town-recovery
          path: |
            dist/local.html
            dist/preview.html
            dist/index.html
            dist/unicorn-stampede.zip
            dist/compression.json
          retention-days: 30
