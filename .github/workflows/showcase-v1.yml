name: Post-js13k showcase
on:
  push:
    branches: [main, agent/post-js13k-showcase-v1, agent/showcase-v1-1, agent/showcase-v1-2-world-systems, agent/showcase-v1-3-faultline-frontier, agent/showcase-v1-4-feel-polish]
  pull_request:
    branches: [main]
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Source syntax
        run: |
          node --check src/core.js
          node --check src/herd.js
          node --check src/render.js
          node --check src/showcase-world-render.js
          node --check src/ui.js
          node --check src/showcase-boot-guard.js
          node --check src/top10.js
          node --check src/polish.js
          node --check src/input-guard.js
          node --check src/whip.js
          node --check src/worlds.js
          node --check src/expansion.js
          node --check src/showcase.js
          node --check src/showcase-world-motion.js
          node --check src/showcase-world-systems.js
          node --check src/showcase-building-detail.js
          node --check src/showcase-civic-detail.js
          node --check src/showcase-frontier.js
          node --check src/showcase-settings.js
          node --check src/showcase-audio.js
          node --check src/showcase-input.js
          node --check src/showcase-performance.js
          node --check src/showcase-feel.js
          node --check src/showcase-stats.js
          node --check src/showcase-shell.js
          node --check scripts/showcase-v14-browser-smoke.mjs
      - name: Showcase contracts
        run: |
          node scripts/showcase-smoke.mjs
          node scripts/showcase-v11-smoke.mjs
          node scripts/showcase-v12-smoke.mjs
          node scripts/showcase-v13-smoke.mjs
          node scripts/showcase-v14-smoke.mjs
          node scripts/v049-world-identity-smoke.mjs
          node scripts/v061-browser-gesture-smoke.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox
      - name: Cross-browser gameplay
        run: |
          node scripts/showcase-browser-smoke.mjs
          node scripts/showcase-v14-browser-smoke.mjs
