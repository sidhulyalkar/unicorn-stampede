name: Post-js13k showcase
on:
  push:
    branches: [main, agent/post-js13k-showcase-v1, agent/showcase-v1-1, agent/showcase-v1-2-world-systems, agent/showcase-v1-3-faultline-frontier, agent/showcase-v1-4-feel-polish, agent/showcase-v1-5-switching-boundaries, agent/showcase-v1-6-stress-fuzz, agent/showcase-v1-7-transition-fuzz, agent/showcase-v1-8-attention-telemetry, agent/showcase-v1-9-menu-polish, agent/showcase-v1-11-art-first-town-detail, agent/showcase-v1-12-native-menu-anatomy-gardens, agent/showcase-v1-13-clean-signs-pedestrian-solids]
  pull_request:
    branches: [main]
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Source syntax
        run: |
          node --check src/core.js
          node --check src/herd.js
          node --check src/render.js
          node --check src/showcase-world-render.js
          node --check src/ui.js
          node --check src/showcase-ui.js
          node --check src/top10.js
          node --check src/polish.js
          node --check src/input-guard.js
          node --check src/whip.js
          node --check src/worlds.js
          node --check src/expansion.js
          node --check src/showcase.js
          node --check src/showcase-world-motion.js
          node --check src/showcase-world-systems.js
          node --check src/showcase-building-detail.js
          node --check src/showcase-gardens.js
          node --check src/showcase-civic-detail.js
          node --check src/showcase-town-detail.js
          node --check src/showcase-frontier.js
          node --check src/showcase-settings.js
          node --check src/showcase-audio.js
          node --check src/showcase-input.js
          node --check src/showcase-performance.js
          node --check src/showcase-boundaries.js
          node --check src/showcase-switching.js
          node --check src/showcase-transitions.js
          node --check src/showcase-feel.js
          node --check src/showcase-stats.js
          node --check src/showcase-menu.js
          node --check src/showcase-session-menu.js
          node --check src/showcase-shell.js
          node --check scripts/build-showcase-html.mjs
          node --check scripts/showcase-v14-browser-smoke.mjs
          node --check scripts/showcase-v15-browser-smoke.mjs
          node --check scripts/showcase-v16-stress-fuzz.mjs
          node --check scripts/showcase-v17-transition-smoke.mjs
          node --check scripts/showcase-v17-frontier-lifecycle.mjs
          node --check scripts/showcase-v18-attention-smoke.mjs
          node --check scripts/showcase-v19-menu-smoke.mjs
          node --check scripts/showcase-v19-legacy-browser-compat.mjs
          node --check scripts/showcase-v111-art-smoke.mjs
          node --check scripts/showcase-v112-detail-smoke.mjs
          node --check scripts/showcase-v112-anatomy-browser.mjs
      - name: Core gameplay regressions
        run: |
          node scripts/dash-contract-smoke.mjs
          node scripts/competitive-smoke.mjs
          node scripts/interference-smoke.mjs
          node scripts/response-smoke.mjs
          node scripts/difficulty-smoke.mjs
          node scripts/shift-rules-smoke.mjs
          node scripts/progression-smoke.mjs
          node scripts/washwater-smoke.mjs
          node scripts/whip-render-smoke.mjs
          node scripts/whip-cadence-smoke.mjs
          node scripts/rules-v044-smoke.mjs
          node scripts/v046-antistuck-smoke.mjs
          node scripts/v049-world-identity-smoke.mjs
          node scripts/v052-gameplay-liveness-smoke.mjs
          node scripts/v053-conquest-menu-smoke.mjs
          node scripts/v056-town-difficulty-smoke.mjs
          node scripts/v060-tutorial-mastery-smoke.mjs
          node scripts/v061-gameplay-polish-smoke.mjs
          node scripts/v061-browser-gesture-smoke.mjs
      - name: Showcase contracts
        run: |
          node scripts/showcase-smoke.mjs
          node scripts/showcase-v11-smoke.mjs
          node scripts/showcase-v12-smoke.mjs
          node scripts/showcase-v13-smoke.mjs
          node scripts/showcase-v14-smoke.mjs
          node scripts/showcase-v15-smoke.mjs
          node scripts/showcase-v111-art-smoke.mjs
          node scripts/showcase-v112-detail-smoke.mjs
      - name: Build standalone playable HTML
        run: node scripts/build-showcase-html.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox
      - name: Cross-browser gameplay
        run: |
          node scripts/showcase-v19-legacy-browser-compat.mjs
          node scripts/showcase-v14-browser-smoke.mjs
          node scripts/showcase-v15-browser-smoke.mjs
          node scripts/showcase-v112-anatomy-browser.mjs
      - name: Deterministic long-run stress
        run: node scripts/showcase-v16-stress-fuzz.mjs
      - name: Capture rescue transition matrix
        run: node scripts/showcase-v17-transition-smoke.mjs
      - name: Frontier lifecycle seams
        run: node scripts/showcase-v17-frontier-lifecycle.mjs
      - name: Attention readability telemetry
        run: node scripts/showcase-v18-attention-smoke.mjs
      - name: Menu and standalone UX
        run: node scripts/showcase-v19-menu-smoke.mjs
      - name: Upload playable showcase HTML
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-showcase-v113
          path: dist/unicorn-stampede-showcase.html
          if-no-files-found: error
