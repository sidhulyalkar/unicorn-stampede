name: promote-v054-semantic-cloudtop
on:
  push:
    branches: [agent/v0.54-semantic-buildings-cloudtop-sf]
    paths:
      - scripts/apply-v054-semantic-cloudtop.mjs
      - scripts/v054-semantic-cloudtop-smoke.mjs
      - .github/workflows/promote-v054-semantic-cloudtop.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.54-semantic-buildings-cloudtop-sf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Apply v0.54 render candidate
        run: node scripts/apply-v054-semantic-cloudtop.mjs
      - name: Parse staged renderer
        run: node --check src/render.js
      - name: Explicit v0.54 visual contract
        run: node scripts/v054-semantic-cloudtop-smoke.mjs
      - name: Full regression and 13kb qualification
        run: npm test
      - name: Promote v0.54 production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render.js package.json scripts/smoke.mjs scripts/v054-semantic-cloudtop-smoke.mjs
          git diff --cached --check
          git commit -m 'feat: semantic buildings and SF-style Cloudtop'
          git push origin HEAD:agent/v0.54-semantic-buildings-cloudtop-sf
      - name: Upload qualified v0.54
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-v054
          path: dist/
          if-no-files-found: error
