name: qualify-frozen-13kb
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Compression report
        run: cat dist/compression.json
      - name: Verify archive root
        run: unzip -t dist/unicorn-stampede.zip && test "$(unzip -Z1 dist/unicorn-stampede.zip)" = "index.html"
      - name: Verify browser-safe local build
        run: test -s dist/local.html && ! grep -q "document.write" dist/local.html && cmp dist/local.html dist/preview.html
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-dist
          path: |
            dist/local.html
            dist/unicorn-stampede.zip
            dist/index.html
            dist/preview.html
            dist/compression.json
