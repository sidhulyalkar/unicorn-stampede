name: v052-liveness-diagnostic
on:
  push:
    branches: [agent/v0.52-gameplay-liveness]
    paths:
      - scripts/v052-liveness-diagnostic.mjs
      - scripts/apply-v052-spawn-clearance.mjs
      - .github/workflows/v052-liveness-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.52-gameplay-liveness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-v052-spawn-clearance.mjs
      - run: node scripts/v052-liveness-diagnostic.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core.js package.json
          git commit -m 'fix: reserve live unicorn spawn space'
          git push origin HEAD:agent/v0.52-gameplay-liveness
